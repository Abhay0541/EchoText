name: EchoText CI (Tests, Ruff, Bandit, Mypy, Pip-Audit)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (excluding heavy GPU/llama.cpp build in CI)
        run: |
          python -m pip install --upgrade pip
          grep -vE "^(--|llama-cpp-python)" requirements.txt > requirements-ci.txt
          grep -v "^-r" requirements-dev.txt >> requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Bandit Security Scanner
        run: bandit -r config.py auth.py database.py rag.py intelligence.py voice_transcriber.py server.py telegram_listener.py phone_bot.py app.py start_echotext.py stop_echotext.py -ll

      - name: Run Mypy Type Checker
        run: mypy config.py auth.py database.py rag.py intelligence.py voice_transcriber.py server.py telegram_listener.py phone_bot.py start_echotext.py stop_echotext.py

      - name: Run Supply-Chain Vulnerability Audit
        run: pip-audit -r requirements-ci.txt

      - name: Run Pytest Suite
        run: pytest -v
