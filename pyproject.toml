[project]
name = "echotext"
version = "2.0.0"
description = "Privacy-first local Telegram auto-reply & human-in-the-loop draft assistant"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 105
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "S", "ASYNC"]
ignore = ["E501", "B008", "S101"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
